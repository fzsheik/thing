# Publishes to npm when a tag like `v0.2.0` is pushed (`npm version minor && git push --follow-tags`).
# Uses npm trusted publishing (OIDC): no token secret. One-time setup on npmjs.com:
# package → Settings → Trusted publishing → GitHub Actions, this repo, workflow file `publish.yml`.
name: Publish agentmascots

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm run build
      - run: npm publish --provenance --access public
